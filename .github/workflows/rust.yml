name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master, v6_rewrite ]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Install nightly toolchain for rustdoc
        run: rustup toolchain install nightly --profile minimal
      - name: Documentation
        run: RUSTDOCFLAGS='-D warnings --cfg docsrs' cargo +nightly doc --all-features --no-deps

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: cargo build --all-features

  build_no_std:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install wasm32v1-none Target
        run: rustup target add wasm32v1-none
      - name: Build no_std
        run: RUSTFLAGS='--cfg getrandom_backend="unsupported"' cargo build --target wasm32v1-none --no-default-features --features steam,serde,otpauth,gen_secret,zeroize
      - name: Build no_alloc
        run: RUSTFLAGS='--cfg getrandom_backend="unsupported"' cargo build --example no_alloc --target wasm32v1-none --no-default-features --features steam,serde,gen_secret,zeroize

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cargo-bins/cargo-binstall@main
      - name: Install cargo-msrv
        run: cargo binstall cargo-msrv
      - name: Verify Minimum Supported Rust Version
        run: cargo msrv verify
      - name: Verify Minimum Supported Rust with all feature
        run: cargo msrv verify --all-features

  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: 0
      RUSTFLAGS: -Cinstrument-coverage
      LLVM_PROFILE_FILE: cargo-test-%p-%m.profraw
    steps:
    - uses: actions/checkout@v7
    - name: Prepare toolchain
      run: rustup toolchain install 1.88 --profile minimal --component llvm-tools-preview
    - name: Download grcov
      run: wget https://github.com/mozilla/grcov/releases/download/v0.10.5/grcov-x86_64-unknown-linux-gnu.tar.bz2
    - name: Decompress grcov
      run: tar xvf grcov-x86_64-unknown-linux-gnu.tar.bz2
    - name: Create coverage output dir
      run: mkdir -p target/coverage
    - name: All features
      run: cargo +1.88 test --all-features
    - name: No feature
      run: cargo +1.88 test
    - name: otpauth feature
      run: cargo +1.88 test --features=otpauth
    - name: gen_secret feature
      run: cargo +1.88 test --features=gen_secret
    - name: otpauth+gensecret feature
      run: cargo +1.88 test --features=gen_secret,otpauth
    - name: qr feature
      run: cargo +1.88 test --features=qr
    - name: serde feature
      run: cargo +1.88 test --features=serde
    - name: steam feature
      run: cargo +1.88 test --features=steam
    - name: zeroize feature
      run: cargo +1.88 test --features=zeroize
    - name: serde+steam feature
      run: cargo +1.88 test --features=serde,steam
    - name: no_std
      run: cargo +1.88 test --no-default-features
    - name: no_std, alloc feature
      run: cargo +1.88 test --no-default-features --features=alloc
    - name: no_std, gen_secret feature
      run: cargo +1.88 test --no-default-features --features=gen_secret
    - name: no_alloc, serde+steam feature
      run: cargo +1.88 test --no-default-features --features=serde,steam
    - name: Create coverage file
      run: ./grcov . --llvm-path "$(rustup run 1.88 rustc --print sysroot)/lib/rustlib/x86_64-unknown-linux-gnu/bin" --binary-path ./target/debug/deps/ -s . -t cobertura --branch --ignore-not-existing --ignore '../*' --ignore "/*" -o target/coverage/cobertura.xml
    - name: Upload to codecov.io
      uses: codecov/codecov-action@v7
      with:
        token: ${{secrets.CODECOV_TOKEN}}
        files: target/coverage/cobertura.xml
        fail_ci_if_error: true

    - name: Archive code coverage results
      uses: actions/upload-artifact@v7
      with:
        name: code-coverage-report
        path: target/coverage/cobertura.xml
